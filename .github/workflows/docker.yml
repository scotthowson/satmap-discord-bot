name: Image

# Builds the image and puts it on GitHub's registry as ghcr.io/<owner>/satmap-discord-bot,
# tagged with VERSION (1.0.0), its short form (1.0) and latest.
on:
  push:
    branches: [main]
    paths: [VERSION, Dockerfile, requirements.txt, bot.py, satmap_data.py, art/**, .github/workflows/docker.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          echo "full=$v" >> "$GITHUB_OUTPUT"
          echo "short=${v%.*}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/satmap-discord-bot" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.full }}
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.short }}
            ${{ steps.v.outputs.image }}:latest
          labels: |
            org.opencontainers.image.title=SatMap Discord Bot
            org.opencontainers.image.description=Slash commands, a live board, news and alerts for a Satisfactory server that runs the SatMap mod
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.full }}
